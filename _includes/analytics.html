{% if jekyll.environment == 'production' and site.analytics.enabled == true and site.analytics.goatcounter_code != blank and site.url != blank %}
<script>
  (function () {
    var code = {{ site.analytics.goatcounter_code | jsonify }};
    if (typeof code !== 'string' || !/^[a-z0-9][a-z0-9-]*$/i.test(code)) return;
    var publicOrigin;
    try { publicOrigin = new URL({{ site.url | jsonify }}).origin; }
    catch (error) { return; }
    if (window.location.protocol !== 'https:' || window.location.origin !== publicOrigin) return;
    var script = document.createElement('script');
    script.async = true;
    script.src = 'https://gc.zgo.at/count.js';
    script.setAttribute('data-goatcounter', 'https://' + code + '.goatcounter.com/count');
    document.body.appendChild(script);
  })();
</script>
{% endif %}
