display_name: Professor Panagiotis (Takis) Tsoutsanis
biography:
- I am Takis Tsoutsanis, Professor of Computational Fluid Dynamics at Cranfield University. I develop
  high-order numerical methods for compressible, turbulent and multiphase flows, with a focus on accuracy,
  robustness and efficient computation on unstructured meshes.
- My work connects finite-volume and discontinuous Galerkin methods, flow modelling and high-performance
  computing. I am the author and lead developer of UCNS3D, an open-source framework for high-order computational
  fluid dynamics.
research_interests:
- High-order finite-volume and discontinuous Galerkin methods
- Unstructured meshes, reconstruction and adaptive dissipation
- Compressible turbulence and implicit large-eddy simulation
- Multiphase flows and shock–interface interactions
- High-performance computing and GPU acceleration
research_overview:
- >-
  My research focuses on the numerical methods that make complex fluid flows computable: accurate reconstruction
  on unstructured meshes, stable treatment of shocks and material interfaces, and efficient resolution of turbulence.
  I develop and analyse high-order finite-volume and discontinuous Galerkin methods, with particular attention
  to how numerical dissipation and dispersion affect the physics captured by a simulation.
- >-
  This work connects algorithm development with applications in compressible, multiphase and high-speed flows.
  Through UCNS3D, I bring these methods into an open-source simulation framework and investigate how they can
  run efficiently on both CPUs and GPUs. The aim is to make accurate, robust CFD practical for complex geometries
  and large-scale calculations.
expertise:
- name: High-order methods on unstructured meshes
  description: Finite-volume and discontinuous Galerkin formulations, accurate reconstruction and mixed-element meshes.
- name: Shock capturing and adaptive methods
  description: WENO and CWENO schemes, a posteriori MOOD limiting, and adaptive control of numerical dissipation and dispersion.
- name: Turbulence and aerodynamics
  description: Implicit large-eddy simulation, RANS modelling and the influence of numerical choices on aerodynamic predictions.
- name: Multiphase and multicomponent flows
  description: Diffuse-interface capturing, shock–interface interactions, cavitation and complex transient flows.
- name: High-speed and hypersonic flows
  description: Compressible-flow algorithms, shock–boundary-layer interactions and aerodynamic and thermal prediction.
- name: High-performance scientific computing
  description: Parallel algorithms, CPU and GPU execution, performance portability and open research software through UCNS3D.
